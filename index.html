<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Сервис создания этикеток — c синхронизацией</title>

  <!-- JsBarcode -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <!-- Сжатие (если пригодится для экспорта/импорта) -->
  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #dce1e4, #a6b1b7);
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { margin-bottom: 8px; }
    .room-id { margin-bottom: 20px; font-size: 12px; opacity: 0.8; }

    form {
      display: flex; flex-direction: column; gap: 10px;
      background: white; padding: 20px; border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 100%; max-width: 640px;
    }
    input[type="text"] { padding: 10px; margin-top: 6px; font-size: 14px; }
    button { padding: 10px; margin-top: 10px; cursor: pointer; }

    table {
      margin-top: 30px; border-collapse: collapse; width: 100%; max-width: 960px; background: white;
    }
    th, td { padding: 10px; border: 1px solid #ccc; text-align: center; }

    #printArea {
      display: none; font-family: Arial, sans-serif; text-align: center; background: white; padding: 20px;
    }

    /* Внешний вид этикетки */
    #priceLine {
      display: flex; justify-content: center; align-items: baseline; gap: 10px; margin-bottom: 0;
    }
    #printPriceValue { font-size: 300px; font-weight: bold; line-height: 1; }
    #printCurrency   { font-size: 100px; font-weight: bold; line-height: 1; position: relative; top: 10px; }
    #printNameText  {
      font-size: 70px; font-weight: normal; line-height: 1.1;
      margin-top: 5px; margin-bottom: 10px;
      white-space: normal; word-break: break-word; text-align: center;
    }
    #barcode { margin-top: 0; height: 250px; }

    /* Печать */
    @media print {
      body * { display: none !important; }
      #printArea, #printArea * { display: block !important; visibility: visible !important; }
      #printArea {
        position: fixed; inset: 0; width: 100vw; height: 100vh;
        display: flex !important; flex-direction: column; justify-content: center; align-items: center; z-index: 9999;
      }
      #priceLine { align-items: baseline; margin-bottom: 0 !important; }
      #printPriceValue { font-size: 300px !important; line-height: 1 !important; font-weight: bold !important; }
      #printCurrency   { font-size: 100px !important; line-height: 1 !important; font-weight: bold !important; top: 10px !important; }
      #printNameText   { font-size: 70px !important; margin-top: 5px !important; margin-bottom: 10px !important; }
      #barcode { height: 250px !important; margin-top: 0 !important; }
    }
  </style>
</head>
<body>
  <h1>СЕРВИС СОЗДАНИЯ ЭТИКЕТОК</h1>
  <div class="room-id" id="roomInfo"></div>

  <form id="labelForm">
    <label>
      Номенклатура
      <input type="text" id="productName" placeholder="Номенклатура" required />
    </label>
    <label>
      Цена
      <input type="text" id="productPrice" placeholder="Цена" required />
    </label>

    <div>
      <p><strong>Тип Скидки</strong></p>
      <label><input type="radio" name="discountType" value="без скидки" checked> Без скидки</label>
      <label><input type="radio" name="discountType" value="дисконт"> Дисконт</label>
    </div>

    <div>
      <p><strong>Укажите Пол</strong></p>
      <label><input type="radio" name="gender" value="мужской"> М</label>
      <label><input type="radio" name="gender" value="женский"> Ж</label>
      <label><input type="radio" name="gender" value="унисекс"> У</label>
      <label><input type="radio" name="gender" value="детский"> Д</label>
    </div>

    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button type="submit">Создать запись</button>
      <button type="button" onclick="downloadCSV()">Скачать CSV</button>
    </div>
  </form>

  <table id="labelTable">
    <thead>
      <tr>
        <th>Штрих-код</th>
        <th>Номенклатура</th>
        <th>Цена</th>
        <th>Пол</th>
        <th>Скидка</th>
        <th>Печать</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div id="printArea">
    <div id="priceLine">
      <span id="printPriceValue">0000</span>
      <span id="printCurrency">грн</span>
    </div>
    <div id="printNameText">Название товара</div>
    <svg id="barcode" width="300" height="130"></svg>
  </div>

  <!-- Firebase (модульные SDK) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, setDoc, onSnapshot, serverTimestamp, runTransaction
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    // ======= 1) ВСТАВЬ СВОЙ КОНФИГ СЮДА (из консоли Firebase) =======
    const firebaseConfig = {
      apiKey:        "PASTE_YOUR_API_KEY",
      authDomain:    "YOUR_PROJECT.firebaseapp.com",
      projectId:     "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId:         "YOUR_APP_ID"
    };
    // ================================================================

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    // ======= Комната (общая область синхронизации) =======
    function getRoomId() {
      const m = location.hash.match(/room=([a-zA-Z0-9_-]+)/);
      if (m) return m[1];
      // если нет — создадим случайную и обновим URL
      const rid = Math.random().toString(36).slice(2, 8);
      const hash = location.hash ? location.hash + `&room=${rid}` : `#room=${rid}`;
      history.replaceState(null, "", `${location.pathname}${hash}`);
      return rid;
    }
    const roomId = getRoomId();
    document.getElementById('roomInfo').textContent = `Комната: ${roomId}  •  Поделись ссылкой — и у всех будет синхронизация.`;

    const form = document.getElementById('labelForm');
    const tableBody = document.querySelector('#labelTable tbody');

    const printArea = document.getElementById('printArea');
    const printNameText = document.getElementById('printNameText');
    const printPriceValue = document.getElementById('printPriceValue');
    const barcodeSvg = document.getElementById('barcode');

    // Локальное состояние (отражение документа для удобства рендера)
    let entries = [];
    let usedBarcodes = new Set();
    let suppressPush = false; // чтобы не зациклиться при onSnapshot

    // ======= Авторизация (анонимная) =======
    signInAnonymously(auth).catch(console.error);
    onAuthStateChanged(auth, async (user) => {
      if (!user) return;

      // инициализация документа комнаты
      const docRef = doc(db, "rooms", roomId);
      const snap = await getDoc(docRef);
      if (!snap.exists()) {
        await setDoc(docRef, {
          entries: [],
          usedBarcodes: [],
          updatedAt: serverTimestamp(),
          createdAt: serverTimestamp()
        });
      }

      // лайв-подписка: любые изменения в облаке — сразу в UI
      onSnapshot(docRef, (ds) => {
        if (!ds.exists()) return;
        const data = ds.data();

        suppressPush = true;
        entries = Array.isArray(data.entries) ? data.entries.slice() : [];
        usedBarcodes = new Set(Array.isArray(data.usedBarcodes) ? data.usedBarcodes : []);

        // перерисовываем таблицу
        tableBody.innerHTML = "";
        entries.forEach(e => addRow(e.code, e.name, e.price, e.gender, e.discount));
        suppressPush = false;
      });

      // Сохраняем в Firestore текущее локальное состояние (если надо)
      async function pushState() {
        if (suppressPush) return;
        await setDoc(docRef, {
          entries,
          usedBarcodes: Array.from(usedBarcodes),
          updatedAt: serverTimestamp()
        }, { merge: true });
      }

      // ======= Генерация и проверка уникального штрих-кода (с учётом облака) =======
      async function generateUniqueBarcodeCloud() {
        // транзакция исключает гонки, если двое создают одновременно
        return await runTransaction(db, async (transaction) => {
          const docSnap = await transaction.get(docRef);
          const cur = docSnap.exists() ? docSnap.data() : { usedBarcodes: [] };
          const currentUsed = new Set(cur.usedBarcodes || []);

          let code;
          do {
            code = Math.floor(Math.random() * 1e12).toString().padStart(12, '0'); // 12 цифр
          } while (currentUsed.has(code));

          currentUsed.add(code);
          transaction.set(docRef, { usedBarcodes: Array.from(currentUsed), updatedAt: serverTimestamp() }, { merge: true });
          return code;
        });
      }

      // ======= Рендер строки таблицы =======
      function addRow(code, name, price, gender, discount) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${code}</td>
          <td>${name}</td>
          <td>${price}</td>
          <td>${gender}</td>
          <td>${discount}</td>
          <td><button data-print="${code}">Печать</button></td>
        `;
        tr.querySelector('button[data-print]').addEventListener('click', () => {
          printLabel(code, name, price, gender, discount);
        });
        tableBody.appendChild(tr);
      }

      // ======= Обработчик формы =======
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('productName').value.trim();
        const price = document.getElementById('productPrice').value.trim();
        const discount = document.querySelector('input[name="discountType"]:checked').value;
        const gender = document.querySelector('input[name="gender"]:checked')?.value || '';

        if (!name || !price) return;

        // генерируем уникальный штрих-код в транзакции Firestore
        const code = await generateUniqueBarcodeCloud();

        const entry = { code, name, price, gender, discount };
        entries.push(entry);
        addRow(entry.code, entry.name, entry.price, entry.gender, entry.discount);

        await pushState(); // отправили в облако всем

        form.reset();
      });

      // ======= Ограничения ввода =======
      document.getElementById('productPrice').addEventListener('input', function () {
        this.value = this.value.replace(/[^0-9]/g, '');
      });
      document.getElementById('productName').addEventListener('input', function () {
        this.value = this.value.replace(/[^a-zA-Zа-яА-ЯёЁіІїЇєЄґҐ\s\-]/g, '');
      });

      // ======= Печать =======
      function printLabel(code, name, price, gender, discount) {
        const fullName = `${name} ${gender}${discount !== 'без скидки' ? ' ' + discount : ''}`.trim();

        // название: переносы и авто-уменьшение, чтобы всегда помещалось
        printNameText.textContent = fullName;
        printNameText.style.fontSize = '70px';
        printNameText.style.whiteSpace = 'normal';

        // если слишком длинно — мягко уменьшаем
        const maxFont = 70, minFont = 36;
        let f = maxFont;
        const measure = () => {
          // ограничим ширину визуально
          return printNameText.scrollHeight > 1.2 * parseFloat(getComputedStyle(printNameText).fontSize)
                 && printNameText.scrollHeight > 90; // эвристика для 2+ строк
        };
        while (f > minFont && measure()) {
          f -= 2;
          printNameText.style.fontSize = f + 'px';
        }

        // цена
        printPriceValue.textContent = price;

        // штрих-код
        barcodeSvg.innerHTML = '';
        JsBarcode(barcodeSvg, code, {
          format: "EAN13",
          lineColor: "#000",
          width: 12,
          height: 260,
          fontSize: 70,
          textMargin: 8,
          margin: 20,
          displayValue: true
        });

        // печать
        printArea.style.display = 'block';
        setTimeout(() => {
          window.print();
          printArea.style.display = 'none';
        }, 300);
      }

      // ======= Экспорт CSV (локально) =======
      window.downloadCSV = function () {
        let csv = 'Штрих-код,Номенклатура,Цена,Пол,Скидка\n';
        entries.forEach(e => {
          csv += `${e.code},${e.name},${e.price},${e.gender},${e.discount}\n`;
        });
        const BOM = '\uFEFF';
        const blob = new Blob([BOM + csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url; link.download = `etiketki_${roomId}.csv`;
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
      };
    });
  </script>
</body>
</html>
